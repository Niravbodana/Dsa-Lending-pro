<svg width="320" height="56" viewBox="0 0 320 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NeerCred — Dream Big. Borrow Smart.">
  <defs>
    <linearGradient id="nc-blue" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.4" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="nc-gold" x1="28" y1="8" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FEF3C7"/>
      <stop offset="0.35" stop-color="#F5D76E"/>
      <stop offset="0.7" stop-color="#E8C547"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="nc-ring-blue" x1="0" y1="24" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="nc-ring-gold" x1="24" y1="24" x2="48" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="nc-cred" x1="58" y1="18" x2="200" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D9488"/>
      <stop offset="0.5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="nc-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="nc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Icon + wordmark — single aligned row -->
  <g transform="translate(0, 4)">
    <g filter="url(#nc-glow)">
      <path d="M24 6 A18 18 0 0 0 24 42" stroke="url(#nc-ring-blue)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M24 6 A18 18 0 0 1 24 42" stroke="url(#nc-ring-gold)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M17 15 L17 33" stroke="url(#nc-blue)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M17 15 L31 33" stroke="url(#nc-blue)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M31 15 L31 33" stroke="url(#nc-gold)" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M24 4.5 L25.2 7.5 L28.5 7.5 L25.8 9.5 L26.8 12.5 L24 10.8 L21.2 12.5 L22.2 9.5 L19.5 7.5 L22.8 7.5 Z" fill="url(#nc-gold)"/>
      <rect x="14" y="8" width="20" height="26" rx="10" fill="url(#nc-shine)" opacity="0.35"/>
    </g>
    <text x="54" y="30" dominant-baseline="middle" font-family="Poppins, system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.4">
      <tspan fill="#0B1220">Neer</tspan><tspan fill="url(#nc-cred)">Cred</tspan>
    </text>
  </g>
  <text x="54" y="50" font-family="Poppins, system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#0B1220" letter-spacing="3.2" opacity="0.85">DREAM BIG. BORROW SMART.</text>
</svg>

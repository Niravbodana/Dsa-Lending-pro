services:
  postgres:
    image: postgres:16-alpine
    container_name: dsa_postgres
    environment:
      POSTGRES_USER: dsa_user
      POSTGRES_PASSWORD: dsa_pass
      POSTGRES_DB: dsa_lending
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsa_user -d dsa_lending"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dsa_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
